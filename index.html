<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enter</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #202124;
  }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #enterBtn {
    border: 0;
    border-radius: 28px;
    padding: 18px 46px;
    font-size: 19px;
    font-weight: 600;
    background: #1769e0;
    color: #fff;
    cursor: pointer;
  }

  #enterBtn:active { transform: scale(.98); }

  /* Full-viewport iframe that shows index.html without navigating away,
     so the fullscreen state entered by the button click is preserved. */
  #frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
  }
</style>
</head>
<body>
  <button id="enterBtn" type="button">Press for sign in</button>
  <iframe id="frame" title="App" allow="fullscreen"></iframe>

<script>
  const btn = document.getElementById("enterBtn");
  const frame = document.getElementById("frame");

  btn.addEventListener("click", async function () {
    // The click is a valid user gesture, so fullscreen is granted here.
    try {
      const el = document.documentElement;
      const request =
        el.requestFullscreen ||
        el.webkitRequestFullscreen ||
        el.msRequestFullscreen;
      if (request) {
        await request.call(el);
      }
    } catch (e) {
      console.log("Fullscreen request was rejected:", e);
    }

    // Load index.html inside a full-screen iframe INSTEAD of navigating,
    // so the document never unloads and fullscreen is preserved.
    frame.src = "poc.html";
    frame.style.display = "block";
    btn.style.display = "none";
  });
</script>
</body>
</html>
